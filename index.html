<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEW STORE - បញ្ចូលហ្គេមកម្ពុជា</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #FFF0F5; color: #333; padding-bottom: 90px; }
        
        .header { background: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #FFD6E8; position: sticky; top: 0; z-index: 100; }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-circle { width: 40px; height: 40px; border-radius: 50%; background: #FF1493; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .logo-text h1 { font-size: 16px; color: #FF1493; font-weight: 800; margin: 0; }
        .logo-text p { font-size: 11px; color: #8E8E93; margin: 0; }
        .tg-top-btn { width: 32px; height: 32px; border-radius: 50%; background: #FFE4E1; display: flex; align-items: center; justify-content: center; color: #FF1493; text-decoration: none; font-size: 14px; }

        .container { padding: 16px; max-width: 480px; margin: 0 auto; }

        /* Navigation Cards */
        .cards-grid-top { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
        .main-card { background: #fff; border: 1.5px solid #FFD6E8; border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .main-card.active { border-color: #FF1493; background: #FFF0F5; }
        .main-card-icon { width: 42px; height: 42px; background: #0B0E14; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; flex-shrink: 0; }
        .main-card-info { flex: 1; }
        .main-card-title { font-size: 14px; font-weight: 800; color: #1C1C1E; margin-bottom: 2px; }
        .main-card-tags { font-size: 11px; color: #8E8E93; }
        .main-card-badge { background: #FFE4E1; color: #FF1493; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
        .main-card.active .main-card-badge { background: #FF1493; color: #fff; }

        /* Banner */
        .banner { background: #fff; border-radius: 20px; padding: 14px; margin-bottom: 12px; border: 1.5px solid #FFD6E8; box-shadow: 0 4px 12px rgba(255,20,147,0.05); display: flex; align-items: center; gap: 12px; }
        .banner-icon { width: 50px; height: 50px; background: #0B0E14; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .banner-info { flex: 1; }
        .banner-top-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .server-country { font-size: 12px; color: #8E8E93; font-weight: 600; }
        .status-badge { background: #FFE4E1; color: #FF1493; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
        .banner-title { font-size: 16px; font-weight: 800; color: #1C1C1E; margin-bottom: 6px; }
        .tags-row { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag { background: #FFF0F5; color: #FF1493; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; border: 1px solid #FFC0CB; }

        .section-title { font-size: 14px; font-weight: 700; color: #1C1C1E; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .step-num-circle { background: #FF1493; color: #fff; width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }

        .form-group { background: #fff; border-radius: 16px; padding: 14px; border: 1.5px solid #FFD6E8; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(255,20,147,0.02); }
        .input-row { display: flex; gap: 8px; margin-top: 8px; }
        .input-field { flex: 1; border: 1px solid #FFC0CB; border-radius: 10px; padding: 10px 12px; font-size: 13px; outline: none; }
        .btn-check { background: #FF1493; color: #fff; border: none; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 12px; cursor: pointer; }

        .profile-card { background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 12px; padding: 10px; display: none; align-items: center; gap: 10px; margin-top: 10px; }
        .profile-card.active { display: flex; }
        .avatar-box { width: 34px; height: 34px; border-radius: 50%; background: #22C55E; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        .prof-info h4 { font-size: 12px; color: #111827; margin: 0; font-weight: 700; }
        .prof-info p { font-size: 10px; color: #16A34A; margin: 0; font-weight: 600; }

        .notice-box { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 16px; padding: 14px; margin-bottom: 14px; font-size: 11px; color: #92400E; }
        .notice-badge { background: #F59E0B; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; display: inline-block; margin-bottom: 6px; }
        .notice-box ul { padding-left: 14px; }
        .notice-box li { margin-bottom: 3px; line-height: 1.4; }

        .qty-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .qty-box { display: flex; align-items: center; background: #F3F4F6; border-radius: 10px; padding: 2px 6px; gap: 8px; }
        .qty-btn { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 1px solid #D1D5DB; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .qty-num { font-size: 12px; font-weight: 700; color: #111827; }

        .items-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item-card { border: 1.5px solid #FFD6E8; border-radius: 14px; padding: 10px; text-align: center; cursor: pointer; background: #fff; position: relative; }
        .item-card.selected { border-color: #FF1493; background: #FFF0F5; }
        
        .item-logo-container { background: #0B0E14; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
        .roblox-logo-sq { width: 24px; height: 24px; background: #fff; border-radius: 6px; transform: rotate(-12deg); display: flex; align-items: center; justify-content: center; }
        .roblox-logo-sq::after { content: ''; width: 9px; height: 9px; background: #0B0E14; border-radius: 2px; }

        .item-name { font-size: 12px; font-weight: 700; color: #1F2937; margin-bottom: 2px; }
        .item-price { font-size: 12px; font-weight: 800; color: #FF1493; margin-bottom: 8px; }
        .item-action { background: #FFE4E1; color: #FF1493; border-radius: 8px; padding: 5px; font-size: 11px; font-weight: 700; display: block; width: 100%; text-align: center; }
        .item-card.selected .item-action { background: #FF1493; color: #fff; }

        .pay-section { background: #FF1493; color: #fff; border-radius: 16px; padding: 14px; margin-top: 14px; box-shadow: 0 4px 15px rgba(255,20,147,0.3); }
        .pay-box { background: #fff; border-radius: 12px; padding: 12px; color: #111827; display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        .pay-name { font-weight: 700; font-size: 12px; }
        .pay-sub { font-size: 10px; color: #6B7280; }

        .btn-submit { width: 100%; background: #111827; color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; margin-top: 12px; cursor: pointer; }

        .live-chat { position: fixed; bottom: 20px; right: 20px; background: #FF1493; color: #fff; border-radius: 30px; padding: 10px 16px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4); z-index: 99; }
        .chat-dot { width: 8px; height: 8px; background: #4CD964; border-radius: 50%; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; border-radius: 24px; width: 100%; max-width: 360px; overflow: hidden; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); position: relative; }
        .modal-close-x { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 18px; color: #8E8E93; cursor: pointer; }
        .modal-header-box { padding: 22px 20px 8px 20px; }
        .khqr-badge-tag { display: inline-block; background: #FFE4E1; color: #FF1493; font-size: 10px; font-weight: 800; padding: 3px 12px; border-radius: 8px; margin-bottom: 8px; }
        .modal-title-main { font-size: 16px; font-weight: 800; color: #1C1C1E; margin-bottom: 2px; }
        .modal-sub-bank { font-size: 11px; color: #6B7280; font-weight: 600; margin-bottom: 14px; }
        
        .price-display-box { background: #FFF0F5; border: 1px solid #FFD6E8; border-radius: 16px; padding: 12px; margin: 0 20px 14px 20px; }
        .price-label-sm { font-size: 11px; color: #6B7280; font-weight: 600; margin-bottom: 2px; }
        .total-price { font-size: 20px; font-weight: 800; color: #FF1493; margin-bottom: 2px; }
        .total-khr { font-size: 12px; color: #6B7280; font-weight: 600; }

        .qr-img-wrap { width: 220px; height: 220px; margin: 0 auto 12px auto; border: 2px solid #FF1493; border-radius: 16px; padding: 10px; background: #fff; display: flex; align-items: center; justify-content: center; }
        .qr-img { width: 100%; height: 100%; object-fit: contain; }

        .modal-footer-pad { padding: 0 20px 20px 20px; }
        .scan-instruction { font-size: 11px; color: #6B7280; margin-bottom: 14px; line-height: 1.4; }
        .btn-tg { display: block; width: 100%; background: #0088CC; color: #fff; text-decoration: none; padding: 12px; border-radius: 12px; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
        .btn-close { display: block; width: 100%; background: #F3F4F6; color: #374151; border: none; padding: 12px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-box">
            <div class="logo-circle">M</div>
            <div class="logo-text">
                <h1>MEW STORE</h1>
                <p>បញ្ចូលហ្គេមកម្ពុ

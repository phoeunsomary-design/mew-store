<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEW STORE - បញ្ចូលទឹកប្រាក់កម្ពុជា</title>
    <link href="https://fonts.googleapis.com/css2?family=Khmer+OS+Siemreap:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Khmer OS Siemreap', sans-serif;
        }
        body {
            background-color: #fff0f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        @media(min-width: 450px) {
            .phone-container {
                border-radius: 30px;
                height: 90vh;
            }
        }
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: #fff;
            border-bottom: 1px solid #eee;
        }
        .store-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .store-logo {
            width: 40px;
            height: 40px;
            border: 2px solid #ff69b4;
            border-radius: 50%;
        }
        .store-name {
            font-weight: bold;
            color: #d81b60;
            font-size: 16px;
        }
        .store-sub {
            font-size: 11px;
            color: #888;
        }
        .plane-icon {
            color: #0088cc;
            font-size: 20px;
        }

        /* Content Body */
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        /* Live Chat Button */
        .live-chat-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #d81b60;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
            cursor: pointer;
        }
        .live-chat-btn::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }
        .modal-container {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            text-align: center;
            border: 3px solid #ff69b4;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #888;
        }
        .badge {
            background-color: #ffe4e1;
            color: #d81b60;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin: 0;
        }
        .bank-name {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
            margin-bottom: 16px;
        }

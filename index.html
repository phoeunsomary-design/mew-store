<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEW STORE - បញ្ចូលហ្គេមកម្ពុជា</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #FFF5F5; color: #333; padding-bottom: 90px; }
        
        .header { background: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #FFD1D1; position: sticky; top: 0; z-index: 100; }
        .logo-box { display: flex; align-items: center; gap: 10px; }
        .logo-circle { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #C53030; background: #fff; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .logo-text h1 { font-size: 16px; color: #C53030; font-weight: 900; margin: 0; }
        .logo-text p { font-size: 11px; color: #8E8E93; margin: 0; }
        
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .header-chat-btn { background: #FED7D7; color: #C53030; border: none; padding: 8px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .tg-top-btn { width: 36px; height: 36px; border-radius: 50%; background: #FED7D7; display: flex; align-items: center; justify-content: center; color: #C53030; text-decoration: none; font-size: 16px; }

        .container { padding: 16px; max-width: 480px; margin: 0 auto; }

        .hero-pink-card { background: linear-gradient(135deg, #9B2C2C, #C53030); border-radius: 20px; padding: 16px; color: #fff; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(197, 48, 48, 0.3); }
        .hero-status-row { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
        .status-pill { background: rgba(255,255,255,0.25); padding: 2px 8px; border-radius: 10px; text-transform: uppercase; }
        .hero-title { font-size: 17px; font-weight: 900; margin-bottom: 6px; }
        .hero-sub { font-size: 11px; opacity: 0.95; line-height: 1.4; }

        .announcement-strip { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 12px; padding: 10px 12px; font-size: 11px; color: #92400E; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-weight: 600; }

        .section-header-title { font-size: 14px; font-weight: 800; color: #C53030; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

        .services-menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .menu-card { background: #fff; border: 1.5px solid #FFD1D1; border-radius: 18px; padding: 16px 12px; cursor: pointer; transition: 0.2s; position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; outline: none; touch-action: manipulation; }
        .menu-card * { pointer-events: none; } /* ការពារកុំឱ្យកូនចៅក្នុងប៊ូតុងបាំងការចុច */
        .menu-card:active { transform: scale(0.96); border-color: #C53030; background: #FFF5F5; }
        
        .badge-tag { position: absolute; top: -8px; left: 12px; background: #C53030; color: #fff; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 8px; z-index: 2; }
        .badge-tag.off { background: #EF4444; }

        .menu-icon-box { background: #0B0E14; width: 100%; height: 75px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-top: 6px; margin-bottom: 10px; }
        .roblox-logo-sq-lg { width: 30px; height: 30px; background: #fff; border-radius: 6px; transform: rotate(-12deg); display: flex; align-items: center; justify-content: center; }
        .roblox-logo-sq-lg::after { content: ''; width: 10px; height: 10px; background: #0B0E14; border-radius: 2px; }

        .menu-title { font-size: 13px; font-weight: 800; color: #1C1C1E; margin-bottom: 2px; }
        .menu-desc { font-size: 10px; font-weight: 700; color: #C53030; }
        .menu-desc.off-text { color: #8E8E93; }

        #detail-workflow { display: none; }
        .back-menu-btn { background: #fff; border: 1.5px solid #FFD1D1; color: #C53030; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 13px; width: 100%; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; touch-action: manipulation; }
        .back-menu-btn:active { background: #FED7D7; }

        .banner { background: #fff; border-radius: 20px; padding: 14px; margin-bottom: 16px; border: 1.5px solid #FFD1D1; box-shadow: 0 4px 12px rgba(197,48,48,0.05); display: flex; align-items: center; gap: 12px; }
        .banner-icon { width: 50px; height: 50px; background: #0B0E14; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 2px solid #C0C0C0; }
        .banner-info { flex: 1; }
        .banner-top-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .server-country { font-size: 11px; color: #8E8E93; font-weight: 600; }
        .status-badge { background: #E6F4EA; color: #137333; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; border: 1px solid #CEEAD6; }
        .banner-title { font-size: 16px; font-weight: 800; color: #1C1C1E; margin-bottom: 6px; }
        .tags-row { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag { background: #FFF5F5; color: #C53030; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 6px; border: 1px solid #FEB2B2; }

        .form-group { background: #fff; border-radius: 16px; padding: 14px; border: 1.5px solid #FFD1D1; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(197,48,48,0.02); }
        .input-row { display: flex; gap: 8px; margin-top: 6px; }
        .input-field { flex: 1; background: #fff; border: 1.5px solid #FEB2B2; border-radius: 10px; padding: 12px; font-size: 14px; color: #333; outline: none; }
        .input-field:focus { border-color: #C53030; }
        .btn-check { background: #C53030; color: #fff; border: none; padding: 0 18px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; touch-action: manipulation; }
        .btn-check:active { opacity: 0.8; }

        .profile-card { background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 12px; padding: 10px; display: none; align-items: center; gap: 10px; margin-top: 10px; }
        .profile-card.active { display: flex; }
        .avatar-box { width: 32px; height: 32px; border-radius: 50%; background: #22C55E; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; }
        .prof-info h4 { font-size: 12px; color: #111827; margin: 0; font-weight: 700; }
        .prof-info p { font-size: 10px; color: #16A34A; margin: 0; font-weight: 600; }

        .notice-box { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 14px; padding: 12px; margin-bottom: 14px; font-size: 11px; color: #92400E; }
        .notice-badge { background: #F59E0B; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; display: inline-block; margin-bottom: 4px; }
        .notice-box ul { padding-left: 14px; }
        .notice-box li { margin-bottom: 2px; line-height: 1.4; }

        .qty-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .qty-box { display: flex; align-items: center; background: #F3F4F6; border-radius: 10px; padding: 2px 6px; gap: 8px; border: 1px solid #E5E7EB; }
        .qty-btn { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 1px solid #D1D5DB; color: #333; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; touch-action: manipulation; }
        .qty-btn:active { background: #E5E7EB; }
        .qty-num { font-size: 13px; font-weight: 700; color: #111827; padding: 0 4px; }

        .items-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .item-card { border: 1.5px solid #FFD1D1; border-radius: 14px; padding: 12px; text-align: center; cursor: pointer; background: #fff; position: relative; width: 100%; outline: none; touch-action: manipulation; }
        .item-card * { pointer-events: none; } /* ការពារកុំឱ្យកូនចៅក្នុងប៊ូតុងបាំងការចុច */
        .item-card.selected { border-color: #C53030; background: #FFF5F5; }
        .item-card:active { transform: scale(0.97); }
        
        .item-logo-container { background: radial-gradient(circle, #2b2b2b 0%, #111111 100%); height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; border: 1.5px solid #C0C0C0; }
        .item-name { font-size: 11px; font-weight: 700; color: #1F2937; margin-bottom: 2px; }
        .item-price { font-size: 12px; font-weight: 800; color: #C53030; margin-bottom: 6px; }
        .item-action { background: #FED7D7; color: #C53030; border-radius: 8px; padding: 6px; font-size: 10px; font-weight: 700; display: block; width: 100%; text-align: center; }
        .item-card.selected .item-action { background: #C53030; color: #fff; }

        .pay-section { background: #C53030; color: #fff; border-radius: 16px; padding: 14px; margin-top: 14px; box-shadow: 0 4px 15px rgba(197, 48, 48, 0.4); }
        .pay-box { background: #fff; border-radius: 12px; padding: 10px 12px; color: #111827; display: flex; align-items: center; justify-content: space-between; margin-top: 8px; border: 1px solid #FFD1D1; }
        .pay-name { font-weight: 700; font-size: 12px; }
        .pay-sub { font-size: 10px; color: #6B7280; }

        .btn-submit { width: 100%; background: #111827; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 14px; margin-top: 12px; cursor: pointer; touch-action: manipulation; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-submit:active { opacity: 0.85; transform: scale(0.99); }

        /* FLOATING LIVE CHAT BUTTON & WIDGET */
        .live-chat-floating-btn { position: fixed; bottom: 20px; right: 20px; background: #C53030; color: #fff; border-radius: 30px; padding: 12px 18px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; text-decoration: none; box-shadow: 0 4px 15px rgba(197, 48, 48, 0.5); z-index: 1200; border: none; cursor: pointer; touch-action: manipulation; }
        .chat-dot { width: 8px; height: 8px; background: #22C55E; border-radius: 50%; }

        .chat-widget-box { display: none; position: fixed; bottom: 80px; right: 20px; width: 320px; max-width: 90vw; background: #fff; border-radius: 20px; border: 1.5px solid #C53030; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 1300; overflow: hidden; flex-direction: column; }
        .chat-widget-box.active { display: flex; }
        .chat-header { background: #C53030; color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 14px; }
        .chat-close-x { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; touch-action: manipulation; }
        .chat-body { padding: 12px; height: 260px; overflow-y: auto; background: #FFF5F5; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
        .chat-msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; line-height: 1.4; word-break: break-word; }
        .chat-msg.admin { background: #fff; color: #333; border: 1px solid #FFD1D1; align-self: flex-start; }
        .chat-msg.user { background: #C53030; color: #fff; align-self: flex-end; }
        .chat-footer { padding: 10px; background: #fff; border-top: 1px solid #FFD1D1; display: flex; gap: 6px; }
        .chat-input { flex: 1; border: 1px solid #FFD1D1; border-radius: 8px; padding: 8px; font-size: 12px; outline: none; }
        .chat-send-btn { background: #C53030; color: #fff; border: none; padding: 0 14px; border-radius: 8px; font-weight: 700; cursor: pointer; touch-action: manipulation; font-size: 12px; }

        /* Modal QR */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; border: 1.5px solid #C53030; border-radius: 24px; width: 100%; max-width: 360px; overflow: hidden; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.15); position: relative; color: #333; }
        .modal-close-x { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 20px; color: #8E8E93; cursor: pointer; touch-action: manipulation; padding: 6px; }
        .modal-header-box { padding: 20px 20px 8px 20px; }
        .khqr-badge-tag { display: inline-block; background: #FED7D7; color: #C53030; font-size: 10px; font-weight: 800; padding: 3px 12px; border-radius: 8px; margin-bottom: 8px; }
        .modal-title-main { font-size: 16px; font-weight: 800; color: #1C1C1E; margin-bottom: 2px; }
        .modal-sub-bank { font-size: 11px; color: #6B7280; font-weight: 600; margin-bottom: 12px; }
        
        .price-display-box { background: #FFF5F5; border: 1px solid #FFD1D1; border-radius: 16px; padding: 12px; margin: 0 20px 14px 20px; }
        .price-label-sm { font-size: 11px; color: #6B7280; font-weight: 600; margin-bottom: 2px; }
        .total-price { font-size: 20px; font-weight: 800; color: #C53030; margin-bottom: 2px; }
        .total-khr { font-size: 12px; color: #6B7280; font-weight: 600; }

        .qr-img-wrap { width: 200px; height: 200px; margin: 0 auto 12px auto; border: 2px solid #C53030; border-radius: 16px; padding: 8px; background: #fff; display: flex; align-items: center; justify-content: center; }
        .qr-img { width: 100%; height: 100%; object-fit: contain; }

        .modal-footer-pad { padding: 0 20px 20px 20px; }
        .scan-instruction { font-size: 11px; color: #6B7280; margin-bottom: 14px; line-height: 1.4; }
        .btn-tg { display: block; width: 100%; background: #0088CC; color: #fff; text-decoration: none; padding: 13px; border-radius: 12px; font-size: 13px; font-weight: 700; margin-bottom: 8px; text-align: center; touch-action: manipulation; }
        .btn-close { display: block; width: 100%; background: #F3F4F6; color: #374151; border: 1px solid #E5E7EB; padding: 13px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; touch-action: manipulation; text-align: center; }

        /* SUCCESS MODAL */
        .success-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1100; align-items: center; justify-content: center; padding: 16px; }
        .success-modal.active { display: flex; }
        .success-content { background: linear-gradient(135deg, #4A0508, #2A0304); border: 2px solid #FF334B; border-radius: 24px; width: 100%; max-width: 380px; padding: 20px; text-align: center; color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
        .success-icon-circle { width: 50px; height: 50px; background: #22C55E; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px auto; font-size: 24px; color: #fff; box-shadow: 0 0 15px rgba(34,197,94,0.4); }
        .success-title { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
        .success-sub { font-size: 11px; color: #D1D5DB; margin-bottom: 16px; }
        
        .receipt-box { background: rgba(255,255,255,0.07); border-radius: 14px; padding: 12px; text-align: left; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.1); }
        .receipt-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
        .receipt-row:last-child { margin-bottom: 0; }
        .receipt-label { color: #D1D5DB; }
        .receipt-val { font-weight: 700; color: #fff; }
        .copy-btn-sm { background: #5C0B10; color: #FFA3AC; border: 1px solid #7A1218; padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; touch-action: manipulation; }

        .telegram-alert-box { background: rgba(255, 51, 7
